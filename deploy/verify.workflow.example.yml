name: Verify application and Docker runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: campus_test
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: campus_current_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campus_test -d campus_current_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://campus_test:ci-only-disposable@127.0.0.1:5432/campus_current_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Create disposable browser roles for access-control tests
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://'), autocommit=True) as connection:
              connection.execute('CREATE ROLE anon')
              connection.execute('CREATE ROLE authenticated')
          PY
      - run: python -m pytest -q
      - run: node --test tests/browser_*.test.cjs
      - run: for file in static/js/*.js; do node --check "$file"; done
      - run: git diff --check
      - run: docker build --pull -t campus-current:ci .
      - name: Start image with isolated PostgreSQL and placeholder provider configuration
        env:
          APP_ENV: production
          AUTH_MODE: supabase
          STORAGE_BACKEND: supabase
          SECRET_KEY: ci-only-disposable-secret-not-for-deployment
          SUPABASE_URL: https://example.invalid
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: |
          export DATABASE_URL="$TEST_DATABASE_URL"
          docker run --rm --network host -e DATABASE_URL -e APP_ENV -e AUTH_MODE -e STORAGE_BACKEND -e SECRET_KEY -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY campus-current:ci flask --app server.app db upgrade
          docker run -d --name campus-ci --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m -e DATABASE_URL -e APP_ENV -e AUTH_MODE -e STORAGE_BACKEND -e SECRET_KEY -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY campus-current:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready; then exit 0; fi
            sleep 1
          done
          docker logs campus-ci
          exit 1
      - if: always()
        run: docker rm -f campus-ci || true
